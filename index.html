
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Racaut Loading</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- White hiding panel -->
    <div class="hider"></div>

    <!-- Rotaract Logo -->
    <div class="name">
        <img
            id="rotaract-logo"
            src="Rotaract.png"
            alt="Rotaract Logo"
        >
    </div>

    <!-- Rotaract Wheel -->
    <div class="wheel">
        <img
            id="wheel-logo"
            src="Picsart_26-07-26_18-06-35-910.png"
            alt="Wheel Logo"
        >
    </div>

    <script>
        // Wait for the loading animation to finish
        setTimeout(() => {

            // Start fade-out
            document.body.classList.add("fade-out");

            // Redirect after fade-out
            setTimeout(() => {
                window.location.href = "index.html";
            }, 400);

        }, 6000);
    </script>

</body>

</html>
